[project]
name = "harness-engineering-demo"
version = "0.1.0"
description = "Harness Engineering Workbench: Unharnessed One-Shot vs Autonomous ADK Loop"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "google-genai>=1.0.0",
    "rich>=13.9.0",
    "pydantic>=2.10.0",
    "python-dotenv>=1.0.1",
    "jinja2>=3.1.4",
    "pytest>=8.3.0",
    "ruff>=0.8.0",
    "codespell>=2.3.0",
    "httpx>=0.28.0",
    "pyright>=1.1.390",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 110
target-version = "py313"
extend-exclude = ["workspaces", "snapshots"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["app", "golden_tests", "verify_demo.py"]
exclude = ["workspaces", ".venv", "snapshots"]
